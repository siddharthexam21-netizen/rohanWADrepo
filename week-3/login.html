<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — ShopSimple</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a class="navbar-brand" href="index.html">ShopSimple</a>
      <div class="ms-auto">
        <a class="btn btn-outline-primary me-2" href="register.html">Register</a>
        <a class="btn btn-primary" href="cart.html">Cart</a>
      </div>
    </div>
  </nav>
  <main class="container my-5">
    <h2>Login</h2>
    <form id="login-form" class="auth-form">
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" required>
      </div>
      <button class="btn btn-primary" type="submit">Login</button>
      <p class="mt-3">New here? <a href="register.html">Create an account</a></p>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
