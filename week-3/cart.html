<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart — ShopSimple</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="site.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a class="navbar-brand" href="index.html">ShopSimple</a>
      <div class="ms-auto">
        <a class="btn btn-outline-primary me-2" href="register.html">Register</a>
        <a class="btn btn-outline-primary me-2" href="login.html">Login</a>
        <a class="btn btn-primary" href="cart.html">Cart</a>
      </div>
    </div>
  </nav>
  <main class="container my-5">
    <h2>Your Cart</h2>
    <div id="cart-items" class="list-group mb-3"></div>
    <div class="d-flex justify-content-between align-items-center">
      <h4>Total: $<span id="cart-total">0.00</span></h4>
      <div>
        <button id="clear-cart" class="btn btn-outline-danger me-2">Clear</button>
        <button id="checkout" class="btn btn-success">Checkout</button>
      </div>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
